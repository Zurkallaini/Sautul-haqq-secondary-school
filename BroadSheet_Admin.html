<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAUTUL HAQQ BROAD SHEET - ADMIN</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#eef2f7;padding:15px}
.container{background:#fff;border-radius:15px;padding:15px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
.header{background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff;padding:18px;border-radius:12px;margin-bottom:15px;text-align:center}
.header h1{font-size:20px;font-weight:700}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.controls select,.controls button{padding:12px;border:none;border-radius:8px;font-size:14px}
.controls select{background:#f5f5f5;flex:1;min-width:120px}
.controls button{background:#0d47a1;color:#fff;cursor:pointer;font-weight:bold}
.controls button.save{background:#16a34a}
.controls button:disabled{background:#999;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.card{background:#fff;border-left:5px solid #0d47a1;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h4{font-size:12px;color:#666}
.card h2{color:#0d47a1;font-size:20px}
.table-container{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th{background:#0d47a1;color:#fff;padding:10px;border:1px solid #ddd;font-size:11px}
td{padding:8px;border:1px solid #ddd;text-align:center;font-size:11px}
tr:nth-child(even){background:#f8fafc}
.student-name{text-align:left;font-weight:600}
.footer{margin-top:20px;background:#f8fafc;padding:20px;border-radius:10px;display:flex;flex-direction:column;gap:15px}
.footer-item{display:flex;flex-direction:column;gap:5px}
.footer label{font-weight:bold;font-size:14px}
.footer input{border:none;border-bottom:2px solid #333;background:transparent;padding:8px 5px;font-size:15px;font-family:inherit;outline:none;width:100%}
.alert{padding:12px;border-radius:8px;margin:10px 0;display:none;text-align:center;font-weight:bold;font-size:14px}
.alert.success{background:#d1fae5;color:#065f46}
.alert.error{background:#fee2e2;color:#991b1b}
.no-class{color:red;text-align:center;font-weight:bold;margin:20px 0;font-size:14px}
@media print{.controls,.alert{display:none}body{background:#fff;padding:0}.container{box-shadow:none}}
@media(min-width:768px){.stats{grid-template-columns:repeat(4,1fr)}.footer{flex-direction:row;justify-content:space-between}}
</style>
</head>
<body>

<div class="container">
<div class="header"><h1>SAUTUL HAQQ BROAD SHEET - ADMIN</h1><p>Academic Performance Summary</p></div>
<div id="alert" class="alert"></div>

<div class="controls">
<select id="classSelect"><option value="">Loading...</option></select>
<select id="termSelect"><option value="">Select Term</option></select>
<select id="sessionSelect"><option value="">Select Session</option></select>
<button id="genBtn" onclick="generateBroadSheet()" disabled>Generate</button>
<button class="save" onclick="saveBroadSheet()">Save</button>
<button onclick="window.print()">Print</button>
</div>

<div id="noClassMsg"></div>

<div class="stats">
<div class="card"><h4>Total Students</h4><h2 id="studentCount">0</h2></div>
<div class="card"><h4>Total Subjects</h4><h2 id="subjectCount">0</h2></div>
<div class="card"><h4>Class Average</h4><h2 id="classAverage">0</h2></div>
<div class="card"><h4>Highest Score</h4><h2 id="highestScore">0</h2></div>
</div>

<div class="table-container"><table><thead><tr id="subjectHeader"><th>S/N</th><th>STUDENT NAME</th></tr></thead><tbody id="broadsheetBody"></tbody></table></div>

<div class="footer">
<div class="footer-item"><label>Form Master:</label><input type="text" id="formMasterName" placeholder="Type Form Master Name"></div>
<div class="footer-item"><label>Principal:</label><input type="text" id="principalName" placeholder="Type Principal Name"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://izhxzibsixhbsucfquyt.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6aHh6aWJzaXhoYnN1Y2ZxdXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzk0NTgsImV4cCI6MjEwMDk1NTQ1OH0.vnP0BhywqE0kt1zrxwq7uGeJ76EOowOHXi5CNyMGWUM";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentData = {classId:"",termId:"",sessionId:"",className:"",termName:"",sessionName:"",students:[],subjects:[]}
function showAlert(msg,type='success'){const a=document.getElementById('alert');a.className=`alert ${type}`;a.innerText=msg;a.style.display='block';setTimeout(()=>a.style.display='none',3000)}
function formatPosition(n){if(n%100>=11 && n%100<=13){return `${n}<sup>th</sup>`;}switch(n%10){case 1:return `${n}<sup>st</sup>`;case 2:return `${n}<sup>nd</sup>`;case 3:return `${n}<sup>rd</sup>`;default:return `${n}<sup>th</sup>`;}}

loadDropdowns();
async function loadDropdowns(){
try{
const classSelect=document.getElementById("classSelect");
const termSelect=document.getElementById("termSelect");
const sessionSelect=document.getElementById("sessionSelect");
const genBtn = document.getElementById("genBtn");

// ADMIN: LOAD ALL CLASSES FROM CLASSES TABLE
const {data:classes, error} = await db.from("classes").select("id, class_name").order("class_name");

if(error){ showAlert('Error: '+error.message,'error'); classSelect.innerHTML = `<option value="">Error Loading</option>`; return; }
if(!classes || classes.length === 0){ classSelect.innerHTML = `<option value="">No Classes Found</option>`; return; }

classSelect.innerHTML = `<option value="">Select Class</option>`;
classes.forEach(c=>{ classSelect.innerHTML+=`<option value="${c.id}">${c.class_name}</option>`; });

genBtn.disabled = false;

const {data:terms} = await db.from("terms").select("*").order("id");
terms.forEach(t=>{ termSelect.innerHTML+=`<option value="${t.id}">${t.term_name}</option>`});
const {data:sessions} = await db.from("sessions").select("*").order("id");
sessions.forEach(s=>{ sessionSelect.innerHTML+=`<option value="${s.id}">${s.session_name}</option>`});

}catch(err){
  console.error(err);
  showAlert('Error loading: '+err.message,'error');
  document.getElementById("classSelect").innerHTML = `<option value="">Error Loading</option>`;
}
}

async function generateBroadSheet(){
const classId=document.getElementById("classSelect").value;
const className=document.getElementById("classSelect").options[document.getElementById("classSelect").selectedIndex].text;
const termId=document.getElementById("termSelect").value;
const termName=document.getElementById("termSelect").options[document.getElementById("termSelect").selectedIndex].text;
const sessionId=document.getElementById("sessionSelect").value;
const sessionName=document.getElementById("sessionSelect").options[document.getElementById("sessionSelect").selectedIndex].text;
if(!classId||!termId||!sessionId){alert("Please Select Class, Term and Session");return;}
currentData = {classId,termId,sessionId,className,termName,sessionName}
const header=document.getElementById("subjectHeader");const body=document.getElementById("broadsheetBody");
header.innerHTML="<th>S/N</th><th>STUDENT NAME</th>";body.innerHTML="Loading...";
const {data:classSubjects} = await db.from("class_subjects").select("*").eq("class_id",classId);
let subjects=classSubjects;currentData.subjects = subjects;
for(const item of subjects){header.innerHTML+=`<th>${item.subject_name.toUpperCase()}</th>`;}
header.innerHTML+=`<th>TOTAL</th><th>POSITION</th>`;
document.getElementById("subjectCount").textContent= subjects.length;
const {data:students} = await db.from("students").select("*").eq("class_id", classId).order("student_name");
currentData.students = students;document.getElementById("studentCount").textContent= students.length;
const {data:allResults} = await db.from("results").select("*").eq("class_id", classId).eq("term_id", termId).eq("session_id", sessionId);
const {data:saved} = await db.from("broad_sheet_settings").select("*").eq("class_id",classId).eq("term_id",termId).eq("session_id",sessionId).single();
if(saved){document.getElementById("formMasterName").value = saved.form_master_name || '';document.getElementById("principalName").value = saved.principal_name || '';}
let broadData=[];
for(const student of students){let studentMarks=[];let grandTotal=0;
for(const subject of subjects){const mark = allResults.find(r => r.student_id == student.id && r.subject_id == subject.subject_id);const score = mark? (mark.total || (parseInt(mark.ca1)||0)+(parseInt(mark.ca2)||0)+(parseInt(mark.exam)||0)) : 0;studentMarks.push(score);grandTotal+=score;}
broadData.push({student,marks:studentMarks,total:grandTotal,position:0});}
broadData.sort((a,b)=>b.total-a.total);let position = 1;
broadData.forEach((item,index)=>{if(index > 0 && item.total < broadData[index-1].total){position = index + 1;}item.position = position;});
const highestScore= broadData.length? broadData[0].total : 0;document.getElementById("highestScore").textContent= highestScore;
let classTotal=0;broadData.forEach(item=>{ classTotal+=item.total; });
const classAverage= students.length? (classTotal/students.length).toFixed(2) : 0;document.getElementById("classAverage").textContent= classAverage;
body.innerHTML = "";
broadData.forEach((item,index)=>{let row="<tr>";row+=`<td>${index+1}</td>`;row+=`<td class="student-name">${item.student.student_name}</td>`;
subjects.forEach((subject,subIndex)=>{row+=`<td>${item.marks[subIndex]||0}</td>`;});
row+=`<td><b>${item.total}</b></td>`;row+=`<td><b>${formatPosition(item.position)}</b></td>`;row+="</tr>";body.innerHTML+=row;});
}

async function saveBroadSheet(){
if(!currentData.classId){alert("Generate broadsheet first");return;}
const formMasterName = document.getElementById("formMasterName").value;
const principalName = document.getElementById("principalName").value;
showAlert('Saving...','success');
const {error} = await db.from("broad_sheet_settings").upsert({
class_id: currentData.classId,class_name: currentData.className,term_id: currentData.termId,term_name: currentData.termName,
session_id: currentData.sessionId,session_name: currentData.sessionName,form_master_name: formMasterName,principal_name: principalName
},{onConflict: 'class_id,term_id,session_id'});
if(error){showAlert('Error: '+error.message,'error');}else{showAlert('BroadSheet Settings Saved Successfully');}
} // <- THIS WAS MISSING
</script>
</body>
</html>
