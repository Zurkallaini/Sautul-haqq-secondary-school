<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Results Portal - Sautul Haqq</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap');
  
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif}
  
  body{
    min-height:100vh;
    background:#0f172a;
    display:flex;align-items:center;justify-content:center;padding:20px
  }
  
  .wrapper{
    display:flex;width:100%;max-width:950px;background:#1e293b;border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);overflow:hidden;border:1px solid rgba(14,165,233,0.15);
    opacity:0; transform:translateY(20px); animation:wrapperIn 0.7s ease forwards;
  }
  @keyframes wrapperIn{ to{opacity:1; transform:translateY(0)} }
  
  .left{
    flex:1.1;background:linear-gradient(135deg,#0c4a6e 0%,#075985 100%);
    padding:55px 40px;color:#fff;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden
  }
  .left::before{
    content:'';position:absolute;width:400px;height:400px;background:rgba(14,165,233,0.1);
    border-radius:50%;top:-100px;right:-100px; animation:orbFloat 12s ease-in-out infinite;
  }
  @keyframes orbFloat{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,20px)} }
  
  .logo-box{
    width:110px;height:110px;background:#fff;border-radius:50%;padding:12px;margin-bottom:25px;z-index:1;
    box-shadow:0 0 30px rgba(14,165,233,0.4); animation:logoPulse 3s ease-in-out infinite;
  }
  .logo-box img{ width:100%; height:100%; object-fit:contain; border-radius:50%; }
  @keyframes logoPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  
  /* 3D ANIMATED SCHOOL NAME */
  .school-3d{
    font-family:'Outfit', sans-serif;font-size:26px;line-height:1.2;font-weight:800;
    color:#fff;z-index:1;perspective:800px;margin-bottom:8px
  }
  .school-3d span{
    display:inline-block;opacity:0;
    transform:translateZ(-100px) rotateY(-90deg);
    animation:flip3D 1.76s forwards;
    text-shadow:0 0 20px rgba(14,165,233,0.5);
  }
  @keyframes flip3D{
    0%{opacity:0;transform:translateZ(-100px) rotateY(-90deg)}
    60%{text-shadow:0 0 30px #0ea5e9}
    100%{opacity:1;transform:translateZ(0) rotateY(0deg);text-shadow:0 2px 10px rgba(0,0,0,0.3)}
  }
  
  .left .sub-title{font-size:18px;opacity:0.95;font-weight:600;z-index:1;margin-bottom:12px}
  .left p{font-size:14px;opacity:0.85;line-height:1.6;z-index:1}
  .edu-icon{margin-top:30px;display:flex;gap:15px;z-index:1}
  .edu-icon div{background:rgba(14,165,233,0.2);padding:12px;border-radius:10px;font-size:22px;border:1px solid rgba(14,165,233,0.3)}
  
  /* DARK NEUMORPHISM RIGHT SIDE */
  .right{
    flex:0.9;padding:50px 40px;display:flex;flex-direction:column;justify-content:center;
    background:#1e293b; border-left:1px solid rgba(255,255,255,0.05)
  }
  .right h1{font-size:24px;color:#f8fafc;margin-bottom:5px}
  .right .sub{font-size:13px;color:#94a3b8;margin-bottom:25px}
  
  .form-group{margin-bottom:17px; opacity:0; animation:fadeUp 0.5s ease forwards}
  .form-group:nth-child(1){animation-delay:0.3s}
  .form-group:nth-child(2){animation-delay:0.4s}
  .form-group:nth-child(3){animation-delay:0.5s}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
  
  .form-group label{display:block;font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:6px;padding-left:4px}
  
  /* DARK NEUMORPH INPUTS */
  .form-group input, .form-group select{
    width:100%;padding:12px 14px;background:#1e293b;border:none;border-radius:12px;
    font-size:14px;color:#f8fafc;transition:0.2s;
    box-shadow: inset 4px 4px 8px #161e2d, inset -4px -4px 8px #26344a;
  }
  .form-group input::placeholder{color:#64748b}
  .form-group input:focus, .form-group select:focus{
    outline:none; box-shadow: inset 2px 2px 4px #161e2d, inset -2px -2px 4px #26344a, 0 0 0 2px rgba(14,165,233,0.3);
  }
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 35px;
  }
  
  /* DARK NEUMORPH BUTTON WITH SPINNER */
  .btn-primary{
    width:100%;padding:13px;background:#1e293b;color:#0ea5e9;border:none;border-radius:12px;
    font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;
    box-shadow: 6px 6px 12px #161e2d, -6px -6px 12px #26344a;
    transition:all 0.2s ease; opacity:0; animation:fadeUp 0.5s ease 0.6s forwards;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow: 8px 8px 16px #161e2d, -8px -8px 16px #26344a;
  }
  .btn-primary:active{
    transform:scale(0.97);
    box-shadow: inset 4px 4px 8px #161e2d, inset -4px -4px 8px #26344a;
  }
  .btn-primary.loading{ color:transparent; pointer-events:none; }
  
  /* SPINNER */
  .spinner{
    width:18px; height:18px; border:2px solid rgba(14,165,233,0.3);
    border-top:2px solid #0ea5e9; border-radius:50%;
    animation:spin 0.8s linear infinite; display:none;
  }
  .btn-primary.loading .spinner{ display:block; position:absolute; }
  @keyframes spin{ to{transform:rotate(360deg)} }
  
  .error { 
    color: #ef4444; 
    font-size: 13px; 
    margin-top: 12px; 
    text-align: center; 
    display: none; 
    font-weight: 600;
  }
  .footer{ text-align:center; margin-top:18px; font-size:12px; color:#64748b; opacity:0; animation:fadeUp 0.5s ease 0.7s forwards }
  
  @media(max-width:900px){
    .wrapper{flex-direction:column;max-width:450px}
    .left{padding:35px 25px;text-align:center}
    .edu-icon{justify-content:center}
    .school-3d{font-size:22px}
    .logo-box{margin:0 auto 20px}
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="left">
    <div class="logo-box">
      <img src="my-logo.png" alt="Sautul Haqq Islamic School">
    </div>
    <h1 class="school-3d" id="schoolName">SAUTUL HAQQ SECONDARY SCHOOL</h1>
    <br>
    <div class="sub-title">SCHOOL RESULTS PORTAL</div>
    <p><h6>Access student results, manage records, and handle academic operations securely.</h6></p> 
    <div class="edu-icon"><div>📊</div><div>📚</div><div>🎓</div></div>
  </div>
  
  <div class="right">
    <h1>Sign In</h1>
    <p class="sub">Enter your credentials to continue</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter Username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password" required>
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" required>
          <option value="">Select Role</option>
          <option value="Admin">Admin</option>
          <option value="Teacher">Teacher</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        <span class="btn-text">Login</span>
        <div class="spinner"></div>
      </button>
      <p class="error" id="errorMsg">Invalid Username, Password or Role</p>
    </form>

    <div class="footer">© Sautul Haqq Secondary School ©</div>
  </div>
</div>

<script>
// 3D LETTER BY LETTER ANIMATION
const text = document.getElementById('schoolName').innerText;
document.getElementById('schoolName').innerHTML = '';
[...text].forEach((char, i) => {
  const span = document.createElement('span');
  span.innerText = char === ' ' ? '\u00A0' : char;
  span.style.animationDelay = `${i * 0.045}s`;
  document.getElementById('schoolName').appendChild(span);
});

// YOUR LOGIN LOGIC + LOADING SPINNER
const SUPER_ADMIN_EMAIL = "muhammadzurkallaini8@gmail.com";
const SUPER_ADMIN_PASS = "Zuks2005";
const SUPER_ADMIN_MASTER_CODE = "ZUKS2005";

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const role = document.getElementById('role').value;
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    
    const adminUser = { username: "@sautulhaqq", password: "Admin@sautulhaqq" };
    const teacherUser = { username: "@sautulhaqq", password: "Teacher@sautulhaqq" };
    
    errorMsg.style.display = 'none';
    
    // SHOW LOADING
    btn.classList.add('loading');
    
    setTimeout(() => {
      // 1. SUPER ADMIN LOGIN AS ADMIN
      if(username === SUPER_ADMIN_EMAIL && password === SUPER_ADMIN_PASS && role === 'Admin'){
          localStorage.setItem('userRole', 'Admin');
          localStorage.setItem('isSuper', 'true');
          localStorage.setItem('username', username);
          localStorage.setItem('userEmail', username);
          window.location.href = 'admin.html';
          return;
      }

      // 2. SUPER ADMIN LOGIN AS TEACHER - SKIP TEACHER CODE PAGE
      if(username === SUPER_ADMIN_EMAIL && password === SUPER_ADMIN_PASS && role === 'Teacher'){
          localStorage.setItem('userRole', 'Teacher');
          localStorage.setItem('isSuper', 'true');
          localStorage.setItem('teacherCode', 'SUPERADMIN');
          localStorage.setItem('teacherName', 'Super Admin');
          localStorage.setItem('userEmail', username);
          window.location.href = 'TeacherDashboard.html';
          return;
      }

      // 3. NORMAL ADMIN
      if(role === 'Admin' && username === adminUser.username && password === adminUser.password) {
          localStorage.setItem('userRole', 'Admin');
          localStorage.setItem('isSuper', 'false');
          localStorage.setItem('username', username);
          localStorage.setItem('userEmail', username);
          window.location.href = 'admin.html';
          return;
      } 
      // 4. NORMAL TEACHER - MUST GO THROUGH TEACHER CODE
      else if(role === 'Teacher' && username === teacherUser.username && password === teacherUser.password) {
          localStorage.setItem('userRole', 'Teacher');
          localStorage.setItem('isSuper', 'false');
          localStorage.setItem('username', username);
          localStorage.setItem('userEmail', username);
          window.location.href = 'teacher-code.html';
          return;
      }
      else {
          btn.classList.remove('loading');
          errorMsg.style.display = 'block';
      }
    }, 800); // fake loading delay
});
</script>
</body>
</html>
